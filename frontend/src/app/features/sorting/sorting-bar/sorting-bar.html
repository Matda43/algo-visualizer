<div class="bar-wrapper">
  <div class="bar"
       [class.state-compare]="bar().state === 'compare'"
       [class.state-swap]="bar().state === 'swap'"
       [class.state-pivot]="bar().state === 'pivot'"
       [class.state-sorted]="bar().state === 'sorted'"
       [class.bar-negative]="bar().value < 0"
       [style.height.%]="height()"
       [style.bottom.%]="bottom()">
  </div>
</div>
