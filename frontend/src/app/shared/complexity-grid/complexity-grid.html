<div class="complexity-grid">
  <div class="complexity-cell">
    <span class="cell-label">Best</span>
    <span class="cell-value color-best">{{ metadata().bestCase }}</span>
  </div>
  <div class="complexity-cell">
    <span class="cell-label">Avg</span>
    <span class="cell-value color-avg">{{ metadata().complexity }}</span>
  </div>
  <div class="complexity-cell">
    <span class="cell-label">Worst</span>
    <span class="cell-value color-worst">{{ metadata().worstCase }}</span>
  </div>
  <div class="complexity-cell">
    <span class="cell-label">Space</span>
    <span class="cell-value color-space">{{ metadata().spaceComplexity }}</span>
  </div>
</div>
