<header class="navbar">
  <div class="navbar-inner">

    <!-- Logo -->
    <a class="logo" routerLink="/">
      <div class="logo-icon">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M2 14L7 2L12 8L9 8L14 14" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
        </svg>
      </div>
      <span class="logo-text">ALGO<strong>VIZ</strong></span>
    </a>

    <!-- Séparateur vertical -->
    <div class="nav-separator"></div>

    <!-- Navigation -->
    <nav class="nav" role="navigation">
      @for (item of navItems(); track item.path) {
        @if (item.available) {
          <a [routerLink]="item.path"
             routerLinkActive="is-active"
             class="nav-link">
            <span class="nav-link-text">{{ item.label }}</span>
          </a>
        } @else {
          <span class="nav-link is-unavailable">
            <span class="nav-link-text">{{ item.label }}</span>
            @if (item.tag) {
              <span class="nav-tag">{{ item.tag }}</span>
            }
          </span>
        }
      }
    </nav>

    <!-- Espace droit -->
    <div class="navbar-right">
      <a href="https://github.com/Matda43/algo-visualizer"
         target="_blank"
         rel="noopener noreferrer"
         class="github-btn"
         aria-label="Voir sur GitHub">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        <span>GitHub</span>
      </a>
    </div>

  </div>
</header>
