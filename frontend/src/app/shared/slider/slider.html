<div class="section section--grow">
  @if(label()){
    <span class="param-label">{{ label() }}</span>
  }
  <span class="param-value" [class.disabled]="disabled()">{{ value() }}{{ unit() }}</span>
  <input 
    class="slider"  
    type="range" 
    [min]="valueMin()"
    [max]="valueMax()"
    [value]="value()"
    [disabled]="disabled()"
    (input)="valueChange(+$any($event.target).value)"
    [aria-label]="title()">
  @if(description()){
    <span class="slider-hint">{{ description() }}</span>
  }
</div>
