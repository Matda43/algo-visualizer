<div class="section">
  @if (label()) {
    <span class="toggle-label">{{ label() }}</span>
  }
  <button 
    class="toggle-wrapper" 
    [class.is-disabled]="disabled()"
    (click)="toggle()">
    <div class="toggle-track" 
      [class.is-active]="active()"
      role="switch"
      [attr.aria-checked]="active()"
      [title]="title()"
      [aria-label]="title()">
      <div class="toggle-thumb"></div>
    </div>
  </button>
</div>
